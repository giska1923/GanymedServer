openapi: 3.1.0
info:
  title: GanymedServer API
  version: 0.6.0
  summary: The backend contract for GanymedEngine clients.
  description: |
    The normative contract between GanymedServer and its clients (the engine, gscli). The code
    implements this file; this file is not generated from the code. Rules for changing it are in
    AGENTS.md. The engine links to this file at a tag (`api-v0.N`), never at `main`.

    Conventions that hold for every route:

    - JSON bodies, at most 64 KiB. Unknown request fields are ignored.
    - Timestamps are RFC 3339, always UTC.
    - Every error is an RFC 9457 problem (`application/problem+json`). Clients switch on `type`,
      never on `title`. The types are listed under `components.schemas.Problem`.
    - Every response carries `X-Request-Id`; quote it when reporting a problem.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose stack

paths:
  /healthz:
    get:
      summary: Liveness
      description: The process can serve. Checks nothing external, so a database outage does not
        cause restarts.
      security: []
      responses:
        "200":
          description: Alive
          content: { text/plain: { schema: { type: string, example: "ok" } } }

  /readyz:
    get:
      summary: Readiness
      description: The process can do useful work, which means Postgres and Redis both answered within 2 s.
      security: []
      responses:
        "200":
          description: Ready
          content: { text/plain: { schema: { type: string, example: "ready" } } }
        "503":
          description: "A dependency is unreachable (the body names it: `postgres unreachable`); send no traffic"

  /v1/auth/device:
    post:
      summary: Sign in with a device ID
      description: |
        Creates the account the first time a device ID is seen and returns the same account every
        time after. Each call starts a new, independent session (refresh family).

        The device ID is the only credential: it must be high-entropy random data, generated once
        per install and kept private. The engine uses a random UUID per `--profile`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: string
                  minLength: 32
                  maxLength: 128
                  example: 8b1f3a52-0d7c-4b8e-9a51-2f6c7d1e0a93
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"

  /v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new session
      description: |
        **Refresh tokens rotate.** A successful call consumes the presented token and returns a
        new one; the client must store it, replacing the old one.

        **Reuse revokes the session.** Presenting a token that was already consumed ends that
        session (its whole refresh family): the presented token and every newer one stop working,
        and the client must sign in again. Two concurrent refreshes with one token count as reuse,
        so a client must serialize its refreshes and share one in-flight refresh between callers.

        Every failure (unknown, expired, consumed, revoked) is the same 401
        `invalid-refresh-token`, on purpose: the remedy is always to sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`invalid-refresh-token`: sign in again"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/me:
    get:
      summary: The signed-in account
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                type: object
                required: [account_id, created_at]
                properties:
                  account_id: { type: string, format: uuid }
                  created_at: { type: string, format: date-time }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/profile:
    get:
      summary: The signed-in player's profile
      description: |
        A player who never chose a name has the default `Player-` followed by the first six hex
        digits of their account ID, uppercased. Display names are labels, not identities: they are
        not unique.
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      summary: Change the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  description: |
                    Trimmed, then 3 to 24 characters: ASCII letters, digits, space, `-`, `_` or `.`,
                    starting and ending with a letter or digit. ASCII only because the engine's HUD
                    font is Latin; widening this is a contract change.
                  example: Ana the Bold
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/leaderboards/{board}:
    parameters:
      - $ref: "#/components/parameters/Board"
    get:
      summary: The first entries of a board, best first
      description: |
        Ranks are standard competition ranking: tied scores share a rank and the next rank skips
        (1, 2, 2, 4). Tied players are listed in the order they reached the score. Each player
        appears once, with their best score.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: "The entries. `entries` is `[]` for an empty board, never null."
          content:
            application/json:
              schema:
                type: object
                required: [board, entries]
                properties:
                  board: { type: string }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/LeaderboardEntry" }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownBoard"

  /v1/leaderboards/{board}/scores:
    parameters:
      - $ref: "#/components/parameters/Board"
    post:
      summary: Submit a score
      description: |
        Records the score and returns the player's standing: the rank of their **best** score on
        the board, and that best. A lower score is recorded but changes nothing on the board.

        **Idempotency.** The `Idempotency-Key` header is required. It identifies one logical
        submission: generate a fresh UUID for each new score, and send the **same** key when
        retrying that score after a timeout or a lost response. A request whose key was already
        processed is not applied again; it returns the original response, with
        `Idempotent-Replayed: true`. That replayed standing is as of the first request, not now.
        Keys are scoped to the account and remembered for at least 24 hours. Reusing a key for a
        different request (another board or score) is refused with 422 `idempotency-key-reused`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: |
                    An integer from 0 to 2^53-1, the largest a double holds exactly (Lua numbers
                    and most JSON parsers are doubles). It must be **written as an integer**:
                    `1234`, not `1234.0`. A client whose numbers are floats must format whole
                    numbers without a fractional part, or the request is a 400.
      responses:
        "200":
          description: "The player's standing. `Idempotent-Replayed: true` when this is a replay."
          headers:
            Idempotent-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Standing" } }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownBoard"
        "422":
          description: "`idempotency-key-reused`: the key was used for a different request"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/leaderboards/{board}/me:
    parameters:
      - $ref: "#/components/parameters/Board"
    get:
      summary: The signed-in player's standing
      description: "A player with no score on the board gets 200 with `rank` and `best` null."
      responses:
        "200":
          description: The standing
          content:
            application/json: { schema: { $ref: "#/components/schemas/Standing" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownBoard"

  /v1/realtime:
    get:
      summary: Open the push socket (WebSocket upgrade)
      description: |
        An RFC 6455 WebSocket upgrade, authenticated by the access token **once, at the upgrade**.
        Everything after the upgrade (messages, presence, close codes, the one-socket-per-account
        rule) is specified in [`realtime.md`](realtime.md), not here: OpenAPI describes requests
        and responses, and a socket is neither.
      responses:
        "101":
          description: Switching Protocols. The socket is open; see realtime.md.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The replica is shutting down; connect again (another replica will take it)

  /v1/party:
    get:
      summary: The signed-in player's party
      description: |
        The state of record. Pushes (`party.updated`, `party.removed`) only say "fetch this
        again". `party` is `null` for a player in no party: a normal state, not an error.
      responses:
        "200":
          $ref: "#/components/responses/PartyOrNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Start a party, led by the caller
      responses:
        "201":
          $ref: "#/components/responses/PartyOrNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "`already-in-party`"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/party/leave:
    post:
      summary: Leave the party
      description: |
        If the leader leaves, the longest-standing remaining member becomes leader. The last member
        out disbands the party. The remaining members get `party.updated`; the leaver gets nothing.
      responses:
        "204": { description: Left }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not-found`: the caller is in no party"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/party/kick:
    post:
      summary: Remove a member (leader only)
      description: The kicked player gets `party.removed` with reason `kicked`; the rest get `party.updated`.
      requestBody:
        $ref: "#/components/requestBodies/TargetAccount"
      responses:
        "204": { description: Removed }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotLeader"
        "404":
          description: "`not-found`: the caller has no party, or the target is not in it"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/party/invites:
    post:
      summary: Invite a player (leader only)
      description: |
        The invitee gets `party.invite` and can accept for 5 minutes. Inviting someone already in
        another party is allowed: they must leave it to accept. The target is not checked against
        the account list (the party module does not read auth's tables); an invite to an ID that
        is no account simply expires.
      requestBody:
        $ref: "#/components/requestBodies/TargetAccount"
      responses:
        "204": { description: Invited }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotLeader"
        "404":
          description: "`not-found`: the caller is in no party"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: "`already-in-party` (the target is already in this party) or `party-full`"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    get:
      summary: The caller's pending invites
      description: "Unexpired invites, soonest-expiring first. `invites` is `[]` when there are none, never null."
      responses:
        "200":
          description: The invites
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/party/invites/{party_id}/accept:
    parameters:
      - $ref: "#/components/parameters/PartyID"
    post:
      summary: Accept an invite and join the party
      description: "Every member, the newcomer included, gets `party.updated`."
      responses:
        "200":
          $ref: "#/components/responses/PartyOrNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not-found`: no such invite, it expired, or the party is gone"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: "`already-in-party` (leave first) or `party-full`"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/party/invites/{party_id}/decline:
    parameters:
      - $ref: "#/components/parameters/PartyID"
    post:
      summary: Decline an invite
      description: Idempotent. Declining an invite that does not exist succeeds, because the end state is the same.
      responses:
        "204": { description: Declined }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/matchmaking/tickets:
    post:
      summary: Queue for a match
      description: |
        A solo player queues alone. A player in a party must be its **leader**, and queues the
        whole party: the ticket's players are the party's members **at this moment** (later party
        changes do not change the ticket). Every player on the ticket gets `ticket.updated`.

        A player can be on at most one **active** ticket: from queueing until the match finishes,
        fails or is cancelled. The ticket's rating is the average of its players' ratings (see
        `/v1/me/profile`).

        Ticket states:

        | State | Meaning | Next |
        |---|---|---|
        | `queued` | waiting for a match | `matched`, `cancelled`, `failed` |
        | `matched` | in a match (`match` is set), waiting for a game server; pushed as `match.found` | `allocating`, `failed` |
        | `allocating` | a game server was claimed and is acknowledging | `ready`, `matched` (withdrawn, retried), `failed` |
        | `ready` | the server is ready: `server.address` and `server.connect_token` are set; pushed as `match.ready` | `finished`, `failed` |
        | `finished` | the server reported the result (`result` is set); pushed as `match.finished` | terminal |
        | `cancelled` | a player on the ticket cancelled it (only from `queued`) | terminal |
        | `failed` | `failure_reason`: `timeout` (2 minutes unmatched), `no_server` (no game server free for 30 s after matching), `allocation_failed` (3 servers failed to acknowledge), `server_lost` (the game server vanished mid-match, or ran longer than 1 hour without reporting); pushed as `ticket.failed` | terminal |

        Matching (informative, not a guarantee): a full group (`max_players`) forms as soon as one
        exists; a smaller group (at least `min_players`) forms once its oldest ticket has waited
        10 s. Tickets group only if their ratings are within each other's window, which starts
        at ±100 and widens by 10 per second waited, up to ±1000. Parties are never split.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  description: "A mode the backend declares. Currently `coop`: 2 to 4 players."
                  example: coop
      responses:
        "201":
          description: Queued
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotLeader"
        "409":
          description: "`already-queued`: a player on the would-be ticket is already queued"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/matchmaking/ticket:
    get:
      summary: The caller's latest ticket, in any state
      description: |
        The state of record, and what a client fetches on every (re)connect: a `match.found` sent
        while the socket was down is lost, but this still shows `matched` and the match.
        Terminal tickets are kept for 10 minutes. `ticket` is `null` when there is none.
      responses:
        "200":
          description: The ticket, or null
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    oneOf:
                      - $ref: "#/components/schemas/Ticket"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/matchmaking/tickets/{ticket_id}:
    parameters:
      - name: ticket_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A ticket the caller is on
      responses:
        "200":
          description: The ticket
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not-found`: no such ticket, it expired, or the caller is not on it"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    delete:
      summary: Cancel a queued ticket
      description: |
        Any player on the ticket may cancel it, which takes the whole party out of the queue. The
        others get `ticket.updated`. Only a `queued` ticket can be cancelled. Cancelling at the
        same instant as the matchmaker matches it yields exactly one of the two: `cancelled`
        (200), or 409 with the ticket now `matched`.
      responses:
        "200":
          description: Cancelled
          content:
            application/json: { schema: { $ref: "#/components/schemas/Ticket" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`not-found`"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: "`ticket-not-queued`: it is already matched, cancelled or failed (the detail names the state)"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/matches/{match_id}/result:
    parameters:
      - name: match_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: A match's result, reported by the fleet agent for its game server
      description: |
        Called by the fleet agent on behalf of the game server that ran the match, never by players
        and, since 0.6.0, never by the game server itself (it reports to its agent; see
        `server-lifecycle.md`). Authenticated by the `result_token` the agent received with the
        allocate command: a credential for this one match and allocation.

        **Idempotent.** Repeating the same report returns the same response and changes nothing.
        Rating changes are applied exactly once per match and player, even across retries after
        a crash. Every player gets `match.finished`, and their tickets become `finished`.

        Co-op ratings: every player's rating moves by the same Elo change, computed as if the team
        (its average rating) played a fixed opponent rated 1500, with K = 32. Victory against even
        odds is +16, defeat -16.
      security:
        - resultToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [victory, defeat] }
      responses:
        "200":
          description: Recorded (or already recorded with the same outcome)
          content:
            application/json:
              schema:
                type: object
                required: [match_id, outcome, rating_change]
                properties:
                  match_id: { type: string, format: uuid }
                  outcome: { type: string, enum: [victory, defeat] }
                  rating_change: { type: integer, description: Applied to every player in the match. }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: "`unauthorized`: wrong credential, or the allocation it belonged to was withdrawn or expired"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
        "409":
          description: "`result-conflict`: a different outcome was already recorded for this match"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

  /v1/fleet/agents/{agent_id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      summary: A fleet agent reports its servers (every second)
      description: |
        The agent's view of its game servers is the backend's view: a server not reported for 5 s
        is gone (the agent died, or lost the network), and is never allocated. The response carries
        the connect-token public key, which the agent passes to the servers it spawns, and the
        servers to retire: withdrawn allocations whose server is still alive (its allocate command
        never arrived). The agent kills those, and replaces them.
      security:
        - agentSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servers]
              properties:
                servers:
                  type: array
                  items:
                    type: object
                    required: [server_id, address, state]
                    properties:
                      server_id: { type: string, format: uuid }
                      address: { type: string, description: "host:port players connect to" }
                      state: { type: string, enum: [starting, ready, allocated, shutdown] }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [connect_token_public_key, retire]
                properties:
                  connect_token_public_key: { type: string, description: "Ed25519, base64url" }
                  retire:
                    type: array
                    description: Server IDs the agent must kill. Usually empty.
                    items: { type: string, format: uuid }
        "401":
          description: "`unauthorized`: wrong agent secret"

  /v1/fleet/agents/{agent_id}/commands:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      summary: Wait for the next command (long-poll, up to 20 s)
      description: |
        Answered as soon as a command for this agent exists, from whichever backend replica
        receives the call. Today the only command is `allocate`.
      security:
        - agentSecret: []
      responses:
        "200":
          description: A command
          content:
            application/json:
              schema:
                type: object
                required: [type, server_id, match_id, players, result_token]
                properties:
                  type: { type: string, enum: [allocate] }
                  server_id: { type: string, format: uuid }
                  match_id: { type: string, format: uuid }
                  players: { type: array, items: { type: string, format: uuid } }
                  result_token:
                    type: string
                    description: |
                      The match's result credential. The agent keeps it and reports the result
                      itself when the server asks (server-lifecycle.md); it is never passed to
                      the game server. `result_url` was removed in 0.6.0.
        "204":
          description: No command within 20 s; call again
        "401":
          description: "`unauthorized`"

  /v1/fleet/agents/{agent_id}/servers/{server_id}/allocated:
    parameters:
      - $ref: "#/components/parameters/AgentID"
      - name: server_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: The server acknowledged its allocation
      description: |
        Moves the match's tickets to `ready` and pushes `match.ready` (with each player's connect
        token). Must arrive within 5 s of the command; after that the allocation was withdrawn.
      security:
        - agentSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [match_id]
              properties:
                match_id: { type: string, format: uuid }
      responses:
        "204":
          description: Accepted; the players are told
        "401":
          description: "`unauthorized`"
        "409":
          description: "`allocation-withdrawn`: this server no longer holds this match. Shut it down"
          content:
            application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from a session response. Clients must treat it as opaque: its contents
        are not part of this contract and may change. Valid for `expires_in` seconds (15 minutes by
        default).
    agentSecret:
      type: http
      scheme: bearer
      description: The fleet agent secret (`GS_FLEET_AGENT_SECRET`), shared by backend and agents.
    resultToken:
      type: http
      scheme: bearer
      description: |
        A per-match result credential, from the allocate command. Held by the fleet agent, which
        reports the result for its game server.

  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 problem details. `type` values:

        | type | status | meaning | client action |
        |---|---|---|---|
        | `urn:ganymed:problem:invalid-request` | 400 | malformed body or invalid field | fix the request |
        | `urn:ganymed:problem:unauthorized` | 401 | missing or invalid access token | sign in |
        | `urn:ganymed:problem:token-expired` | 401 | access token expired | refresh, then retry once |
        | `urn:ganymed:problem:invalid-refresh-token` | 401 | refresh failed for any reason | sign in |
        | `urn:ganymed:problem:not-found` | 404 | no such resource (e.g. an unknown leaderboard) | |
        | `urn:ganymed:problem:idempotency-key-reused` | 422 | the Idempotency-Key was used for a different request | a client bug: one key per logical request |
        | `urn:ganymed:problem:not-party-leader` | 403 | only the party leader can do that | |
        | `urn:ganymed:problem:already-in-party` | 409 | already in a party (or the target already is in yours) | leave first |
        | `urn:ganymed:problem:party-full` | 409 | the party has 4 members | |
        | `urn:ganymed:problem:already-queued` | 409 | a player on the would-be ticket is already in a queued ticket | `GET /v1/matchmaking/ticket` |
        | `urn:ganymed:problem:ticket-not-queued` | 409 | the ticket left the queue (matched, cancelled or failed) | re-fetch it |
        | `urn:ganymed:problem:result-conflict` | 409 | a different outcome was already recorded for this match | (game servers only) |
        | `urn:ganymed:problem:allocation-withdrawn` | 409 | the server no longer holds this match | (fleet agents only) shut the server down |
        | `urn:ganymed:problem:internal` | 500 | server fault; details are in the server log | retry later |
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Session:
      type: object
      required: [account_id, token_type, access_token, expires_in, refresh_token]
      properties:
        account_id: { type: string, format: uuid }
        token_type: { type: string, const: Bearer }
        access_token: { type: string, description: Opaque to the client. }
        expires_in: { type: integer, description: Seconds until the access token expires. }
        refresh_token: { type: string, description: Single use. Store it; replace it on every refresh. }

    Standing:
      type: object
      required: [rank, best]
      properties:
        rank: { type: [integer, "null"], description: "Competition rank of the best score; null if none." }
        best: { type: [integer, "null"], description: "The best score; null if none." }

    LeaderboardEntry:
      type: object
      required: [rank, account_id, display_name, score]
      properties:
        rank: { type: integer }
        account_id: { type: string, format: uuid }
        display_name: { type: string }
        score: { type: integer }

    Party:
      type: object
      required: [party_id, leader_id, members]
      properties:
        party_id: { type: string, format: uuid }
        leader_id: { type: string, format: uuid }
        members:
          type: array
          description: In join order. At most 4.
          items:
            type: object
            required: [account_id, display_name, status, leader]
            properties:
              account_id: { type: string, format: uuid }
              display_name: { type: string }
              status:
                type: string
                enum: [online, away, offline]
                description: "See realtime.md, Presence. `away` is the 30 s reconnection grace."
              leader: { type: boolean }

    Ticket:
      type: object
      required: [ticket_id, mode, state, players, created_at, match]
      properties:
        ticket_id: { type: string, format: uuid }
        mode: { type: string, example: coop }
        state: { type: string, enum: [queued, matched, allocating, ready, finished, cancelled, failed] }
        players:
          type: array
          description: The players on this ticket (a party, or one player).
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        failure_reason: { type: string, enum: [timeout, no_server, allocation_failed, server_lost], description: Set when state is failed. }
        server:
          description: Set when state is ready.
          oneOf:
            - type: object
              required: [address, connect_token]
              properties:
                address: { type: string, description: "host:port: send UDP `HELLO <connect_token>` here" }
                connect_token: { type: string, description: "Freshly minted on every read; valid 30 s. See connect-token.md" }
            - type: "null"
        result:
          description: Set when state is finished.
          oneOf:
            - type: object
              required: [outcome, rating_change]
              properties:
                outcome: { type: string, enum: [victory, defeat] }
                rating_change: { type: integer }
            - type: "null"
        match:
          description: Set from matched onwards.
          oneOf:
            - type: object
              required: [match_id, players]
              properties:
                match_id: { type: string, format: uuid }
                players:
                  type: array
                  description: Every player in the match, across all its tickets.
                  items: { type: string, format: uuid }
            - type: "null"

    Invite:
      type: object
      required: [party_id, from, expires_at]
      properties:
        party_id: { type: string, format: uuid }
        from:
          type: object
          required: [account_id, display_name]
          properties:
            account_id: { type: string, format: uuid }
            display_name: { type: string }
        expires_at: { type: string, format: date-time }

  requestBodies:
    TargetAccount:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [account_id]
            properties:
              account_id: { type: string, format: uuid }

  parameters:
    AgentID:
      name: agent_id
      in: path
      required: true
      description: Chosen by the agent, stable across its restarts
      schema: { type: string }
    PartyID:
      name: party_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Board:
      name: board
      in: path
      required: true
      description: "A board declared by the backend. Currently: `proving-ground`."
      schema: { type: string, example: proving-ground }

  responses:
    PartyOrNull:
      description: "`{\"party\": {...}}`, or `{\"party\": null}` when not in a party"
      content:
        application/json:
          schema:
            type: object
            required: [party]
            properties:
              party:
                oneOf:
                  - $ref: "#/components/schemas/Party"
                  - type: "null"
    NotLeader:
      description: "`not-party-leader`"
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Profile:
      description: The profile
      content:
        application/json:
          schema:
            type: object
            required: [account_id, display_name]
            properties:
              account_id: { type: string, format: uuid }
              display_name: { type: string, example: Player-7F3A9C }
              rating:
                type: integer
                description: Skill rating used by matchmaking. 1500 until results change it (B5).
                example: 1500
    UnknownBoard:
      description: "`not-found`: no such leaderboard"
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Session:
      description: "A new session. Sent with `Cache-Control: no-store`."
      content:
        application/json: { schema: { $ref: "#/components/schemas/Session" } }
    InvalidRequest:
      description: "`invalid-request`"
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Unauthorized:
      description: "`unauthorized` (sign in) or `token-expired` (refresh). Sent with `WWW-Authenticate: Bearer`."
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }

security:
  - bearer: []
